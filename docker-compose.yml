services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrum}
      POSTGRES_DB: scrum
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrum -d scrum"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scrum:${POSTGRES_PASSWORD:-scrum}@db:5432/scrum?schema=public
      DIRECT_URL: postgresql://scrum:${POSTGRES_PASSWORD:-scrum}@db:5432/scrum?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (openssl rand -base64 32)}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      # รันผ่าน http://localhost — ถ้าอยู่หลัง HTTPS ให้ลบบรรทัดนี้
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
