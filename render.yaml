# Render Blueprint — New > Blueprint > เลือก repo นี้
services:
  - type: web
    name: scrum-framework
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon: ใช้ connection string แบบ direct (ไม่มี -pooler) เพื่อให้ prisma migrate ทำงานได้
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Bangkok
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
